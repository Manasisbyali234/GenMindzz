<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GenMindz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GenMindz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script
    src="https://www.google.com/recaptcha/api.js?render=explicit"
    async
    defer
  ></script>
  <script>
    window.__genmindzRecaptchaWidgets = {};
    window.__genmindzRecaptcha = {
      render: function (
        containerId,
        siteKey,
        tokenCallbackName,
        expiredCallbackName,
        errorCallbackName
      ) {
        if (!window.grecaptcha || !siteKey) {
          return null;
        }

        const container = document.getElementById(containerId);
        if (!container) {
          return null;
        }

        const existingWidgetId = window.__genmindzRecaptchaWidgets[containerId];
        if (existingWidgetId !== undefined && existingWidgetId !== null) {
          return existingWidgetId;
        }

        const widgetId = window.grecaptcha.render(container, {
          sitekey: siteKey,
          callback: function (token) {
            const callback = window[tokenCallbackName];
            if (typeof callback === "function") {
              callback(token);
            }
          },
          "expired-callback": function () {
            const callback = window[expiredCallbackName];
            if (typeof callback === "function") {
              callback();
            }
          },
          "error-callback": function () {
            const callback = window[errorCallbackName];
            if (typeof callback === "function") {
              callback();
            }
          },
        });

        window.__genmindzRecaptchaWidgets[containerId] = widgetId;
        return widgetId;
      },
      reset: function (containerId) {
        if (!window.grecaptcha) {
          return;
        }

        const widgetId = window.__genmindzRecaptchaWidgets[containerId];
        if (widgetId !== undefined && widgetId !== null) {
          window.grecaptcha.reset(widgetId);
        }
      },
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
